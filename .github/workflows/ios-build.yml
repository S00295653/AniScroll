name: Build iOS

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.101'

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios --skip-manifest-update --skip-sign-check

      - name: Restore
        run: dotnet restore AniScroll.Maui/AniScroll.Maui.csproj

      - name: Build iOS (sans signing)
        run: dotnet build AniScroll.Maui/AniScroll.Maui.csproj -f net9.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="" -p:CodesignProvision="" -p:EnableCodeSigning=false -p:MtouchLink=None

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: AniScroll.Maui/bin/Release/net9.0-ios/**/*.app
          if-no-files-found: warn
