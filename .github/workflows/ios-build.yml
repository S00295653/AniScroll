name: Build iOS

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode_26.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.app
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          else
            echo "No Xcode 26.x found:"
            ls /Applications/ | grep Xcode
            exit 1
          fi
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios --skip-sign-check

      - name: Restore
        run: dotnet restore AniScroll.Maui/AniScroll.Maui.csproj

      - name: Build iOS (sans signing)
        run: dotnet build AniScroll.Maui/AniScroll.Maui.csproj -f net9.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="" -p:CodesignProvision="" -p:EnableCodeSigning=false -p:MtouchLink=None

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: AniScroll.Maui/bin/Release/net9.0-ios/**/*.app
          if-no-files-found: warn
