<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AniScroll</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/app.css" />

    <!-- Favicon standard -->
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" /> 
    <!-- iOS "Add to Home Screen" -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" /> 
    <!-- PWA / Android Chrome -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0e0e16" />
</head>

<body>
    <div id="app">
        <div class="anime-scroll-app">
            <div class="loading-area">
                <div class="loading-box">
                    <div class="spinner"></div>
                    <p class="loading-title">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="_content/AniScroll.Shared/js/scroll-helpers.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
