<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AniScroll</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/base.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/card.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/custom-list-manager.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/filter-bar.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/info.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/list-editor.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/lists-panel.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/loading.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/modal.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/nav.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/profile-panel.css" />
    <link rel="stylesheet" href="_content/AniScroll.Shared/css/search.css" />
</head>

<body>
    <div id="app">
        <div class="anime-scroll-app">
            <div class="loading-area">
                <div class="loading-box">
                    <div class="spinner"></div>
                    <p class="loading-title">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onerror = function (msg, src, line, col, err) {
            document.querySelector('.loading-title').textContent = msg;
            document.querySelector('.loading-subtitle').textContent = (src || '') + ':' + line;
        };
    </script>

    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
