[build]
  publish = "bin/Release/net10.0/publish/wwwroot"
  command = "dotnet publish -c Release -o bin/Release/net10.0/publish"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"